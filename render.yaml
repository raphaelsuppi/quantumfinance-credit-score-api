services:
  - type: web
    name: quantumfinance-credit-score-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: RATE_LIMIT
        value: "60"
